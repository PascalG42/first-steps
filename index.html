      startButton.disabled = false;
      pauseButton.disabled = true;
    }

    // Schaltet den Lautlos-Modus um und aktualisiert Symbol/Optik des Buttons
    // (reines Symbol statt Text: 🔈 = Ton an, 🔇 = durchgestrichen/stumm)
    // Die beiden SVG-Icons für den Ton-Button (Lautsprecher an / durchgestrichen).
    // Werden per innerHTML eingesetzt, da es zwei verschiedene Icons sind (kein
    // einzelnes Zeichen wie bei textContent).
    const SYMBOL_TON_AN =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>' +
      '<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>' +
      "</svg>";

    const SYMBOL_TON_AUS =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>' +
      '<line x1="23" y1="9" x2="17" y2="15"></line>' +
      '<line x1="17" y1="9" x2="23" y2="15"></line>' +
      "</svg>";

    function schalteStummUm() {
      stummgeschaltet = !stummgeschaltet;
      stummButton.innerHTML = stummgeschaltet ? SYMBOL_TON_AUS : SYMBOL_TON_AN;
      stummButton.classList.toggle("stumm-aktiv", stummgeschaltet);
    }

    // ---- Buttons mit den Funktionen verknüpfen ----
    startButton.addEventListener("click", starteTimer);
    pauseButton.addEventListener("click", pausiereTimer);
    resetButton.addEventListener("click", setzeZurueck);
    stummButton.addEventListener("click", schalteStummUm);

    // Phase 7b: Übung hinzufügen
    uebungHinzufuegenButton.addEventListener("click", fuegeUebungHinzu);

    // Änderungen an den beiden globalen Werten wirken sofort auf die Gesamtdauer.
    // routineGeaendert(false) baut die Übungsliste dabei nicht neu auf, damit der
    // Cursor im Eingabefeld bleibt.
    pauseDauerEingabe.addEventListener("input", function () {
      routineGeaendert(false);
    });
    seitenwechselDauerEingabe.addEventListener("input", function () {
      routineGeaendert(false);
    });

    // Phase 9: Startbildschirm und Editor
    zurueckButton.addEventListener("click", geheZurueck);
    bearbeitenButton.addEventListener("click", schalteBearbeitenModusUm);
    neuButton.addEventListener("click", function () {
      oeffneEditor(null);
    });
    speichernButton.addEventListener("click", speichereRoutineAusEditor);
    loeschenButton.addEventListener("click", loescheRoutineAusEditor);
    routineNameEingabe.addEventListener("input", function () {
      editorMeldung.textContent = "";
    });

    // Phase 9: freier Modus
    freiButton.addEventListener("click", oeffneFreienModus);
    freiStartButton.addEventListener("click", starteFreienModus);
    [freiUebungEingabe, freiPauseEingabe, freiRundenEingabe].forEach(function (feld) {
      feld.addEventListener("input", function () {
        aktualisiereFreieGesamtdauer();
        // Auch direkt speichern, nicht erst beim Start - sonst wären geänderte Werte
        // verloren, wenn man die Ansicht ohne Start wieder verlässt
        speichereFreieWerte();
      });
    });

    // Phase 9: gespeicherte Daten laden und den Startbildschirm anzeigen
    ladeRoutinenAusSpeicher();
    ladeFreieWerte();
    zeigeStartbildschirm();

    // PWA: Service Worker registrieren, damit die App offline funktioniert und auf
    // Android ueber Chrome installierbar wird. Der Check "in navigator" sorgt dafuer,
    // dass nichts passiert, falls ein Browser Service Worker gar nicht unterstuetzt.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (fehler) {
          console.log("Service Worker konnte nicht registriert werden:", fehler);
        });
      });
    }
  </script>

</body>
</html>
