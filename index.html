<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Ohne diesen Viewport-Tag rendern mobile Browser die Seite gegen eine virtuelle
     Desktop-Breite (~980px) und zoomen dann verkleinert auf den Bildschirm - alles
     wirkt dadurch klein und man muss manuell reinzoomen. width=device-width sorgt
     dafuer, dass 1 CSS-Pixel = 1 Geraete-Pixel entspricht, initial-scale=1 verhindert
     zusaetzliches Herauszoomen beim ersten Laden. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervalltimer</title>
<!-- PWA: Manifest verknuepfen, damit Chrome auf Android die App als installierbar erkennt -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#204e6f">
<style>
  /* Grundlegendes Layout: der Inhalt (siehe #inhalt) wird als Block vertikal zentriert.
     Die Groessen von Ring, Schrift und Buttons sowie die Abstaende zwischen den
     Abschnitten skalieren ueber clamp() mit der Bildschirmgroesse (vw/vh), damit die
     App auf dem Handy die verfuegbare Flaeche grosszuegig ausfuellt, statt als kleiner
     Block auf leerem Hintergrund zu wirken - ohne dabei auf sehr kleinen Bildschirmen
     zu ueberlaufen. clamp(minimum, bevorzugter-Wert, maximum) heisst: nutze den
     mittleren Wert, aber nie kleiner als das Minimum und nie groesser als das Maximum. */
  body {
    font-family: Arial, sans-serif;
    background-color: #1e1e2f;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    /* min-height statt einer festen height: der Inhalt darf bei Bedarf wachsen und die
       Seite scrollbar werden, statt bei zu wenig Platz (z.B. auf schmalen Handys)
       abgeschnitten zu werden.
       100dvh berücksichtigt zusätzlich die (ein-/ausblendende) Adressleiste mobiler
       Browser genauer als 100vh - Browser ohne dvh-Unterstützung nutzen einfach 100vh. */
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: clamp(16px, 4vh, 40px) 0;
    box-sizing: border-box;
    /* Sanfter Übergang, wenn sich die Hintergrundfarbe je nach Phase ändert */
    transition: background-color 0.4s ease;
  }

  /* Umhüllt den gesamten sichtbaren Inhalt. Der Abstand zwischen den Abschnitten ist
     bewusst grosszuegig gewaehlt (nicht nur ein Minimalwert) und waechst auf hohen
     Bildschirmen noch etwas mit (ueber die vh-Komponente im clamp), statt ungenutzten
     Platz einfach leer zu lassen. */
  #inhalt {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 3.5vh, 40px);
  }

  /* Phase 2: Hintergrundfarbe zeigt, ob gerade "Übung" oder "Pause" aktiv ist.
     Übung nutzt jetzt das vormalige Pause-Blau, Pause einen dazu passenden, ruhigen
     Grünton in ähnlicher Helligkeit - das wirkt weiterhin harmonisch und bleibt klar
     unterscheidbar. Weißer Text hat auf beiden Farben einen Kontrast von über 4.5:1
     (WCAG-AA-Richtwert für guten Lesekontrast). */
  body.phase-uebung {
    background-color: #386e94; /* freundliches Blau (vormals die Pause-Farbe) */
  }

  body.phase-pause {
    background-color: #367857; /* ruhiges, passendes Grün */
  }

  /* Phase 7b: dritte Phasenart - der Seitenwechsel innerhalb einer zweiseitigen Übung.
     Bewusst ein warmer Bernsteinton: klar von Blau (Übung) und Grün (Pause) zu
     unterscheiden, auch aus dem Augenwinkel. Weißer Text erreicht darauf einen
     Kontrast von rund 5.5:1 und liegt damit über dem WCAG-AA-Richtwert von 4.5:1. */
  body.phase-seitenwechsel {
    background-color: #8a5f33;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 7vw, 40px);
  }

  /* Phase 7b: Der gesamte Einstellungsteil (Übungsliste + globale Werte). Sobald das
     Training läuft, wird er komplett ausgeblendet (siehe body.training-laeuft weiter
     unten), damit auf dem Handy nur noch Ring und Steuerbuttons zu sehen sind. */
  #konfiguration {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2vh, 16px);
    width: clamp(300px, 90vw, 460px);
  }

  /* Die beiden globalen Einstellungsfelder nebeneinander. Jedes Feld nimmt über
     flex:1 gleich viel Platz ein, das Eingabefeld selbst füllt sein Feld über
     width:100% komplett aus, statt eine feste, kleine Breite zu haben. */
  #globale-einstellungen {
    display: flex;
    /* Untergrenze bewusst nicht zu klein, damit die Felder auch bei voller
       Breite immer klar als getrennte Felder erkennbar bleiben */
    gap: clamp(20px, 4vw, 28px);
    width: 100%;
  }

  /* Phase 7b: Die Übungsliste. Bei vielen Übungen wird sie scrollbar, statt die
     Steuerbuttons darunter aus dem Bild zu schieben. */
  #uebungen-liste {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: clamp(150px, 30vh, 300px);
    overflow-y: auto;
  }

  /* Eine Übungszeile ist bewusst zweizeilig aufgebaut: oben Name und Dauer, unten
     Häkchen und Aktionen. Auf einem Handy nebeneinander wären die einzelnen Ziele
     zu klein zum sicheren Treffen (Fitts's Law); untereinander bleibt jedes Ziel
     ausreichend groß und die Zeile trotzdem als eine Einheit erkennbar. */
  #uebungen-liste li {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background-color: rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .uebung-kopf,
  .uebung-fuss {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .uebung-fuss {
    justify-content: space-between;
  }

  /* Laufende Nummer der Übung - dient beim Training als Orientierung ("Übung 3 von 6") */
  .uebung-nummer {
    font-size: clamp(14px, 3.6vw, 17px);
    opacity: 0.7;
    min-width: 1.4em;
    text-align: right;
  }

  .uebung-name {
    flex: 1;
    min-width: 0; /* verhindert Overflow auf sehr schmalen Bildschirmen */
    box-sizing: border-box;
    padding: clamp(7px, 2vw, 10px);
    border-radius: 6px;
    border: none;
    font-size: clamp(15px, 3.8vw, 18px);
  }

  /* Das Dauer-Feld braucht nur Platz für zwei bis drei Ziffern */
  .uebung-dauer {
    width: 4.5em;
    flex: none;
    text-align: center;
  }

  .uebung-einheit {
    font-size: clamp(14px, 3.6vw, 17px);
    opacity: 0.75;
  }

  /* Häkchen "beide Seiten": Label und Kästchen gehören zusammen, deshalb umschließt
     das <label> beides - dadurch schaltet auch ein Tipp auf den Text das Häkchen um
     und das Trefferfeld wird deutlich größer. */
  .beide-seiten {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(14px, 3.6vw, 17px);
    cursor: pointer;
  }

  .beide-seiten input[type="checkbox"] {
    width: clamp(18px, 4.5vw, 22px);
    height: clamp(18px, 4.5vw, 22px);
    margin: 0;
    cursor: pointer;
  }

  .uebung-aktionen {
    display: flex;
    gap: 4px;
  }

  /* Die vier kleinen Symbol-Buttons einer Übungszeile (hoch, runter, duplizieren,
     löschen). Bewusst gruppiert und mit Abstand zum übrigen Inhalt, damit reine
     Icon-Buttons hier vertretbar bleiben. */
  .uebung-aktionen button {
    margin: 0;
    font-size: clamp(15px, 4vw, 19px);
    padding: clamp(6px, 1.8vw, 9px);
    background-color: rgba(255, 255, 255, 0.12);
  }

  .uebung-aktionen button:hover:not(:disabled) {
    background-color: rgba(255, 255, 255, 0.24);
  }

  /* Zeile unter der Liste: Übung hinzufügen und die Gesamtdauer der Routine */
  #routine-fuss {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
  }

  #uebung-hinzufuegen-button {
    margin: 0;
    font-size: clamp(15px, 3.8vw, 18px);
    padding: clamp(8px, 2.2vw, 12px) clamp(12px, 3.5vw, 18px);
  }

  /* Gesamtdauer der Routine - ohne sie ist bei einer variablen Übungsliste nicht mehr
     absehbar, wie lange das Training überhaupt dauert */
  #gesamtdauer-anzeige {
    font-size: clamp(14px, 3.6vw, 17px);
    opacity: 0.85;
  }

  /* Solange das Training läuft, verschwinden Einstellungen und Presets komplett.
     Sichtbar bleiben nur Ring, Phasenanzeige und die Steuerbuttons - das ist der
     einzige Teil, der während einer Übung tatsächlich gebraucht wird. */
  body.training-laeuft #konfiguration,
  body.training-laeuft #presets-bereich {
    display: none;
  }

  .eingabe-feld {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex: 1;
    min-width: 0; /* verhindert Overflow der Felder auf sehr schmalen Bildschirmen */
  }

  .eingabe-feld label {
    font-size: clamp(15px, 4vw, 20px);
  }

  input[type="number"] {
    width: 100%;
    /* border-box: Padding wird in die 100%-Breite eingerechnet statt zusätzlich
       dazuaddiert zu werden - sonst würde jedes Feld über seinen zugewiesenen Platz
       hinausragen und in den Abstand zum Nachbarfeld hineinlaufen */
    box-sizing: border-box;
    padding: clamp(10px, 2.5vw, 14px);
    font-size: clamp(18px, 5vw, 26px);
    text-align: center;
    border-radius: 6px;
    border: none;
  }

  /* Hält Phasen- und Rundenanzeige eng zusammen (kleiner, fester Abstand statt des
     großen #inhalt-Zwischenraums) */
  #status-anzeige {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  #phase-anzeige {
    font-size: clamp(24px, 6.5vw, 36px);
    font-weight: bold;
    letter-spacing: 2px;
    /* Phase 7b: Hier steht jetzt der frei eingegebene Übungsname. Ohne Begrenzung
       würde ein langer Name die Zeile über den Bildschirmrand hinausschieben, deshalb
       Umbruch statt Überlauf - auch mitten im Wort, falls jemand ein sehr langes Wort
       ohne Leerzeichen eingibt. */
    max-width: clamp(300px, 90vw, 460px);
    text-align: center;
    overflow-wrap: break-word;
  }

  /* Zeigt den Rundenfortschritt, z.B. "Runde 3 von 5" */
  #runden-anzeige {
    font-size: clamp(18px, 4.5vw, 26px);
    opacity: 0.85;
  }

  /* Hält Ring, Fertig-Meldung und Buttons eng zusammen, damit unter dem Ring keine
     große Lücke zu den Buttons entsteht */
  #ring-und-buttons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 2vw, 14px);
  }

  /* Umhüllt Countdown-Zahl und Fortschrittsring, damit die Zahl mittig im Ring sitzt.
     Deutlich groesser als vorher, da der Ring das wichtigste Element ist und auch aus
     etwas Entfernung (waehrend des Trainings) gut lesbar sein soll. */
  #countdown-wrapper {
    position: relative;
    width: clamp(340px, 86vw, 500px);
    height: clamp(340px, 86vw, 500px);
  }

  /* Der Ring liegt als SVG hinter der Zahl, gedreht auf "12 Uhr"-Start */
  #fortschritts-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  /* Blasser Kreis, der den vollen Umfang zeigt (die "Spur" für den Fortschritt) */
  .ring-hintergrund {
    fill: none;
    stroke: rgba(255, 255, 255, 0.15);
    stroke-width: 10;
  }

  /* Der eigentliche Fortschritt: leert sich synchron zum Countdown (siehe aktualisiereRing).
     stroke-dasharray ist fest auf den Umfang des Kreises gesetzt (r=90 -> ca. 565.49),
     muss also zum r-Attribut der beiden <circle>-Elemente im HTML passen. */
  #ring-fortschritt {
    fill: none;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 565.49;
    /* Weiche, flüssige Bewegung statt sprunghaftem Sprung bei jedem Sekunden-Tick */
    transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
  }

  /* Ringfarbe passt sich der jeweiligen Phase an (dunkel auf dem mittelhellen Übungs-Blau,
     hell auf dem dunkleren Pause-Grün) */
  body.phase-uebung #ring-fortschritt {
    stroke: #123c57;
  }

  body.phase-pause #ring-fortschritt {
    stroke: #b5e3cc;
  }

  body.phase-seitenwechsel #ring-fortschritt {
    stroke: #f4d9b4;
  }

  /* Die große Countdown-Anzeige, jetzt mittig über dem Ring platziert */
  #anzeige {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Deutlich größer als vorher, damit die Zahl den Platz füllt, den der Ring
       vorgibt, statt klein in der Mitte zu stehen (Verhältnis Schrift zu Ring
       bewusst ähnlich wie bei #countdown-wrapper gehalten) */
    font-size: clamp(80px, 22vw, 130px);
    font-weight: bold;
    font-variant-numeric: tabular-nums; /* Ziffern bleiben gleich breit, kein "Wackeln" */
  }

  /* Buttons: neutraler, dunkler Blaugrau-Ton statt des vorherigen Lila-Tons - passt
     unaufdringlich zu beiden Phasenfarben (Blau und Grün), statt mit ihnen zu konkurrieren */
  button {
    font-size: clamp(18px, 4.5vw, 24px);
    padding: clamp(12px, 3vw, 16px) clamp(18px, 5vw, 28px);
    margin: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background-color: #37424f;
    color: white;
    /* Zentriert den Inhalt (Text oder Icon) sauber in der Mitte des Buttons */
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Icons in Buttons: 1em groß, folgen also automatisch der font-size des jeweiligen
     Buttons (inkl. dessen clamp()-Skalierung) - "currentColor" lässt das Icon dabei
     immer die aktuelle Textfarbe des Buttons annehmen */
  button svg {
    width: 1em;
    height: 1em;
    display: block;
  }

  /* Start/Pause/Zurücksetzen als reine Symbol-Buttons in einer Dreier-Reihe (der
     Ton-Button wurde herausgenommen, siehe #stumm-button weiter unten). Die Reihe
     behält die bisherige Gesamtbreite, die drei Buttons werden aber so groß wie
     möglich skaliert (großzügiges Padding, große Symbol-Schrift) für eine bessere
     Bedienbarkeit mit dem Daumen. */
  #button-bereich {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px, 3vw, 16px);
    width: clamp(300px, 80vw, 420px);
  }

  #button-bereich button {
    /* Der Grid-"gap" übernimmt den Abstand, deshalb hier kein zusätzlicher Button-Rand */
    margin: 0;
    width: 100%;
    box-sizing: border-box; /* Padding zählt zur Breite dazu statt sie zu vergrößern */
    /* Große Symbol-Schrift statt Text, quadratisch für eine gut tippbare Fläche */
    font-size: clamp(28px, 8vw, 40px);
    padding: clamp(16px, 5vw, 22px) 0;
    aspect-ratio: 1;
  }

  /* Ton-Button: reines Lautsprecher-Symbol, klein und fest oben rechts positioniert -
     unabhängig vom übrigen Layout darunter (bleibt beim Scrollen an derselben Stelle). */
  #stumm-button {
    position: fixed;
    top: 12px;
    right: 12px;
    margin: 0;
    font-size: 22px;
    padding: 8px 10px;
    z-index: 10; /* liegt über dem restlichen Inhalt */
  }

  button:hover {
    background-color: #4c5a68;
  }

  button:disabled {
    background-color: #33393f;
    cursor: not-allowed;
  }

  /* Lautlos-Button sieht aktiv (gedrückt) aus, solange stummgeschaltet ist */
  #stumm-button.stumm-aktiv {
    background-color: #8a3a3a;
  }

  /* Wird angezeigt, wenn das Training abgelaufen ist. min-height (statt fester height)
     reserviert nur so viel Platz, wie die aktuelle Schriftgröße braucht - bei leerem
     Text bleibt so kein unnötig großer Leerraum zum Ring darüber bzw. den Buttons
     darunter stehen, und der Text wird beim großen Ende der Schriftgröße nicht
     abgeschnitten. */
  #fertig-meldung {
    font-size: clamp(20px, 5vw, 28px);
    color: #7CFC00;
    min-height: clamp(24px, 6vw, 34px);
  }

  /* Phase 4: Bereich zum Speichern/Laden von Presets */
  #presets-bereich {
    width: clamp(300px, 85vw, 440px);
  }

  .preset-eingabe {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  #preset-name-eingabe {
    flex: 1;
    box-sizing: border-box; /* Padding zählt zur Breite dazu statt sie zu vergrößern */
    padding: clamp(8px, 2vw, 11px);
    border-radius: 6px;
    border: none;
    font-size: clamp(15px, 3.8vw, 18px);
  }

  #presets-liste {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 160px;
    overflow-y: auto;
  }

  #presets-liste li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: rgba(255, 255, 255, 0.08);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: clamp(13px, 3.2vw, 15px);
  }

  #presets-liste li span {
    flex: 1;
    margin-right: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #presets-liste button {
    font-size: clamp(13px, 3.2vw, 15px);
    padding: 4px 10px;
    margin: 0 0 0 4px;
  }
</style>
</head>
<body>

  <!-- Ton-Symbol: fest oben rechts, unabhängig vom Layout darunter (siehe CSS).
       Der Inhalt (Lautsprecher-Icon) wird per JS ausgetauscht, siehe schalteStummUm(). -->
  <button id="stumm-button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
  </button>

  <!-- Umhüllt den gesamten Inhalt als vertikal zentrierten Block (siehe #inhalt im CSS) -->
  <div id="inhalt">

  <h1>Intervalltimer</h1>

  <!-- Phase 7b: Einstellungen bestehen jetzt aus der Übungsliste (wird per JavaScript
       aufgebaut, siehe zeigeUebungenAn) und zwei Werten, die für alle Übungen gelten. -->
  <div id="konfiguration">
    <ul id="uebungen-liste"></ul>

    <div id="routine-fuss">
      <button id="uebung-hinzufuegen-button">+ Übung</button>
      <span id="gesamtdauer-anzeige"></span>
    </div>

    <div id="globale-einstellungen">
      <div class="eingabe-feld">
        <label for="pause-dauer-eingabe">Pause (Sek.)</label>
        <input type="number" id="pause-dauer-eingabe" value="15" min="1">
      </div>
      <div class="eingabe-feld">
        <!-- 0 ist hier ausdrücklich erlaubt: dann folgt die zweite Seite ohne
             Zwischenabschnitt direkt auf die erste. -->
        <label for="seitenwechsel-dauer-eingabe">Seitenwechsel (Sek.)</label>
        <input type="number" id="seitenwechsel-dauer-eingabe" value="5" min="0">
      </div>
    </div>
  </div>

  <!-- Phasen- und Rundenanzeige eng zusammen, statt mit dem großen Standardabstand -->
  <div id="status-anzeige">
    <!-- Zeigt an, ob gerade "Übung" oder "Pause" läuft -->
    <div id="phase-anzeige">ÜBUNG</div>

    <!-- Zeigt den Rundenfortschritt an -->
    <div id="runden-anzeige">Runde 1 von 5</div>
  </div>

  <!-- Ring, Fertig-Meldung und Buttons ebenfalls eng zusammen, damit unter dem Ring
       keine große Lücke zu den Buttons entsteht -->
  <div id="ring-und-buttons">
    <!-- Fortschrittsring + große Countdown-Anzeige -->
    <div id="countdown-wrapper">
      <svg id="fortschritts-ring" viewBox="0 0 200 200">
        <circle class="ring-hintergrund" cx="100" cy="100" r="90"></circle>
        <circle id="ring-fortschritt" cx="100" cy="100" r="90"></circle>
      </svg>
      <div id="anzeige">00:30</div>
    </div>

    <div id="fertig-meldung"></div>

    <!-- Start/Pause/Zurücksetzen als reine Symbol-Buttons in einer Dreier-Reihe.
         Icons als Inline-SVG statt Emoji, damit sie auf allen Geräten einheitlich
         aussehen (keine externe Icon-Bibliothek nötig - die Pfade sind fest hier drin). -->
    <div id="button-bereich">
      <button id="start-button">
        <!-- Play-Dreieck -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      </button>
      <button id="pause-button" disabled>
        <!-- Zwei Pause-Balken -->
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
      <button id="reset-button">
        <!-- Kreisförmiger Reset-/Neuladen-Pfeil -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Phase 4: Presets speichern, laden und löschen -->
  <div id="presets-bereich">
    <div class="preset-eingabe">
      <input type="text" id="preset-name-eingabe" placeholder="Name für Preset (z.B. Dehnroutine Morgen)">
      <button id="preset-speichern-button">Speichern</button>
    </div>
    <ul id="presets-liste"></ul>
  </div>

  </div> <!-- Ende #inhalt -->

  <script>
    // ---- Variablen, die den Zustand des Timers speichern ----

    // verbleibende Sekunden der aktuell laufenden Phase (Übung oder Pause)
    let verbleibendeSekunden = 30;

    // die ID des laufenden Intervalls (wird von setInterval zurückgegeben).
    // Wir brauchen sie, um den Timer später wieder stoppen zu können (clearInterval).
    let intervallId = null;

    // Phase 7a: Der Ablaufplan - eine fertig ausgerechnete Liste aller Abschnitte des
    // Trainings, die der Timer nur noch der Reihe nach abarbeitet. Vorher wurde bei jedem
    // Phasenwechsel neu berechnet, was als Nächstes kommt (Übung? Pause? Ende?). Jetzt
    // steht das alles schon vorher fest, was spätere Sonderfälle (z.B. Seitenwechsel ohne
    // Pause) auf eine reine Frage des Planaufbaus reduziert - die Timer-Logik selbst muss
    // dafür nicht mehr angefasst werden.
    //
    // Jeder Eintrag sieht so aus:
    //   { typ: "uebung" | "pause", dauer: 30, runde: 1 }
    // typ   = wie der Abschnitt angezeigt und beklungen wird
    // dauer = Länge in Sekunden
    // runde = zu welcher Runde der Abschnitt gehört (nur für die Anzeige "Runde X von Y")
    let ablaufplan = [];

    // Phase 7a: an welcher Stelle im ablaufplan wir uns gerade befinden (0 = erster Eintrag).
    // Ersetzt die früheren Variablen aktuellePhase und aktuelleRunde - beides steht jetzt
    // im Abschnitt selbst und wird über aktuellerAbschnitt() gelesen.
    let aktuellerAbschnittIndex = 0;

    // Phase 7b: Die Übungsliste - das ist ab jetzt die eigentliche Einstellung der App.
    // Jeder Eintrag:
    //   { name: "Hamstring", dauer: 30, beideSeiten: true }
    // name        = frei wählbar, darf leer bleiben (dann wird "Übung 3" angezeigt)
    // dauer       = Sekunden pro Seite
    // beideSeiten = wenn true, läuft die Übung zweimal (links/rechts) mit einem
    //               Seitenwechsel dazwischen, aber ohne Pause
    let uebungen = [];

    // Wie viele Übungen das Training insgesamt hat. Wird beim Erzeugen des Ablaufplans
    // gesetzt und nur noch für den Text "Übung X von Y" gebraucht.
    let gesamtUebungen = 1;

    // Gesamtdauer (in Sekunden) der aktuell laufenden Phase - wird gebraucht, um den
    // Fortschrittsring als Anteil (verbleibendeSekunden / aktuellePhaseDauer) zu berechnen
    let aktuellePhaseDauer = 30;

    // Umfang des Ring-Kreises (2 * π * Radius). Der Radius (90) muss zum r-Attribut
    // der beiden <circle>-Elemente im HTML passen und zum stroke-dasharray-Wert im CSS.
    const RING_UMFANG = 2 * Math.PI * 90;

    // Phase 3: der Audio-Kontext für den synthetisch erzeugten Ton am Trainingsende (Web Audio API).
    // Bleibt anfangs "null" und wird erst beim ersten Start erzeugt (siehe initialisiereAudio),
    // weil Browser Töne nur nach einer Nutzer-Interaktion erlauben (Klick auf "Start").
    let audioContext = null;

    // Sound-Dateien für die Countdown-Vorwarnung und den Phasenwechsel (liegen im Ordner
    // "sound_effects" neben dieser index.html). Jede Datei wird nur einmal geladen und
    // bei Bedarf einfach erneut abgespielt (siehe spieleAudioDatei).
    const beepSound = new Audio("sound_effects/beep.wav"); // Vorwarnung (2x identisch)
    const endSound = new Audio("sound_effects/end.wav"); // Pause beginnt
    const startSound = new Audio("sound_effects/start.wav"); // Übung beginnt

    // Phase 7c: Signal für den Seitenwechsel. "pop.wav" ist kurz und perkussiv und hebt
    // sich damit deutlich von den beiden längeren, abfallenden Tönen oben ab - man hört
    // also ohne hinzusehen, ob umgelagert oder ausgeruht werden soll. Zwei Audio-Objekte
    // für dieselbe Datei, damit der Ton zweimal kurz hintereinander erklingen kann, ohne
    // dass der zweite Anschlag den ersten abschneidet.
    const seitenwechselSound1 = new Audio("sound_effects/pop.wav");
    const seitenwechselSound2 = new Audio("sound_effects/pop.wav");

    // Lautlos-Modus: wenn true, spielen spieleAudioDatei() und spieleTon() keinen Ton ab.
    // Vibration ist davon bewusst nicht betroffen (bleibt als haptisches Feedback erhalten).
    let stummgeschaltet = false;

    // Phase 4 / 7b: die Schlüssel, unter denen im localStorage gespeichert wird.
    // Mit der Übungsliste hat sich der Aufbau eines Presets grundlegend geändert,
    // deshalb ein neuer Schlüssel. Der alte wird beim Start einmal entfernt, damit
    // keine unbrauchbaren Daten im Browser zurückbleiben (die alten Presets sollten
    // laut Absprache nicht übernommen werden).
    const PRESETS_SPEICHER_SCHLUESSEL = "intervalltimer-routinen";
    const ALTER_PRESETS_SCHLUESSEL = "intervalltimer-presets";

    // Zusätzlich wird die gerade eingestellte Routine automatisch gespeichert. Ohne das
    // müsste die komplette Übungsliste nach jedem Schließen der App neu eingetippt oder
    // aus einem Preset geladen werden.
    const AKTUELLE_ROUTINE_SCHLUESSEL = "intervalltimer-aktuelle-routine";

    // Phase 4: die Liste aller gespeicherten Presets, z.B.
    // [{ name: "Dehnroutine Morgen", uebungen: [...], pauseDauer: 15, seitenwechselDauer: 5 }, ...]
    let presets = [];

    // ---- Referenzen auf die HTML-Elemente holen ----
    const uebungenListe = document.getElementById("uebungen-liste");
    const uebungHinzufuegenButton = document.getElementById("uebung-hinzufuegen-button");
    const gesamtdauerAnzeige = document.getElementById("gesamtdauer-anzeige");
    const pauseDauerEingabe = document.getElementById("pause-dauer-eingabe");
    const seitenwechselDauerEingabe = document.getElementById("seitenwechsel-dauer-eingabe");
    const phaseAnzeige = document.getElementById("phase-anzeige");
    const rundenAnzeige = document.getElementById("runden-anzeige");
    const anzeige = document.getElementById("anzeige");
    const ringFortschritt = document.getElementById("ring-fortschritt");
    const fertigMeldung = document.getElementById("fertig-meldung");
    const startButton = document.getElementById("start-button");
    const pauseButton = document.getElementById("pause-button");
    const resetButton = document.getElementById("reset-button");
    const stummButton = document.getElementById("stumm-button");
    const presetNameEingabe = document.getElementById("preset-name-eingabe");
    const presetSpeichernButton = document.getElementById("preset-speichern-button");
    const presetsListe = document.getElementById("presets-liste");

    // Liest eine Zahl aus einem Eingabefeld und sorgt dafür, dass sie mindestens "minimum" ist
    function holeZahlAusEingabe(element, minimum) {
      let wert = parseInt(element.value, 10);
      if (isNaN(wert) || wert < minimum) {
        wert = minimum;
      }
      return wert;
    }

    // ---- Phase 7a: Ablaufplan aufbauen und lesen ----

    // Phase 7b: Baut den Ablaufplan aus einer Übungsliste auf. Bewusst eine reine
    // Rechenfunktion ohne Zugriff auf Eingabefelder - dadurch lässt sich derselbe
    // Aufbau auch für ein gespeichertes Preset durchrechnen (etwa um dessen
    // Gesamtdauer anzuzeigen), ohne es vorher laden zu müssen.
    //
    // Regeln:
    // - eine einseitige Übung ergibt einen Abschnitt
    // - eine zweiseitige Übung ergibt zwei Abschnitte (links/rechts) mit einem
    //   Seitenwechsel dazwischen, aber ohne Pause
    // - ist die Seitenwechseldauer 0, entfällt der Zwischenabschnitt und die zweite
    //   Seite beginnt unmittelbar
    // - zwischen zwei Übungen steht eine Pause, nach der letzten Übung nicht
    function baueAblaufplan(uebungsliste, pauseDauer, seitenwechselDauer) {
      const plan = [];

      uebungsliste.forEach(function (uebung, index) {
        const nummer = index + 1; // 1-basiert für die Anzeige "Übung 3 von 6"

        if (uebung.beideSeiten) {
          plan.push({ typ: "uebung", dauer: uebung.dauer, nummer: nummer, name: uebung.name, seite: "links" });

          if (seitenwechselDauer > 0) {
            plan.push({ typ: "seitenwechsel", dauer: seitenwechselDauer, nummer: nummer, name: uebung.name, seite: null });
          }

          plan.push({ typ: "uebung", dauer: uebung.dauer, nummer: nummer, name: uebung.name, seite: "rechts" });
        } else {
          plan.push({ typ: "uebung", dauer: uebung.dauer, nummer: nummer, name: uebung.name, seite: null });
        }

        // Nach der letzten Übung folgt keine Pause mehr - das Training ist dort zu Ende
        if (index < uebungsliste.length - 1) {
          plan.push({ typ: "pause", dauer: pauseDauer, nummer: nummer, name: uebung.name, seite: null });
        }
      });

      return plan;
    }

    // Baut den Ablaufplan aus dem, was gerade eingestellt ist.
    function erzeugeAblaufplan() {
      gesamtUebungen = uebungen.length; // für die Anzeige "Übung X von Y"
      return baueAblaufplan(uebungen, holeZahlAusEingabe(pauseDauerEingabe, 1), holeZahlAusEingabe(seitenwechselDauerEingabe, 0));
    }

    // Addiert die Dauer aller Abschnitte eines Plans - also wie lange das Training
    // insgesamt läuft.
    function berechneGesamtdauer(plan) {
      return plan.reduce(function (summe, abschnitt) {
        return summe + abschnitt.dauer;
      }, 0);
    }

    // Anzeigename einer Übung: der eingegebene Name, sonst ersatzweise "Übung 3"
    function beschriftungFuer(abschnitt) {
      const name = (abschnitt.name || "").trim();
      return name !== "" ? name : "Übung " + abschnitt.nummer;
    }

    // Gibt den Abschnitt zurück, der gerade läuft. Ersetzt die früheren Variablen
    // aktuellePhase (jetzt .typ) und aktuelleRunde (jetzt .runde).
    function aktuellerAbschnitt() {
      return ablaufplan[aktuellerAbschnittIndex];
    }

    // Übernimmt Dauer des aktuellen Abschnitts in den Countdown. Wird beim Zurücksetzen
    // und bei jedem Abschnittswechsel aufgerufen.
    function uebernehmeAktuellenAbschnitt() {
      const abschnitt = aktuellerAbschnitt();
      verbleibendeSekunden = abschnitt.dauer;
      aktuellePhaseDauer = abschnitt.dauer; // für den Fortschrittsring
    }

    // Wandelt eine Anzahl Sekunden in das Format "MM:SS" um, z.B. 75 -> "01:15"
    function formatiereZeit(sekundenGesamt) {
      const minuten = Math.floor(sekundenGesamt / 60);
      const sekunden = sekundenGesamt % 60;
      // padStart(2, "0") sorgt dafür, dass immer zwei Ziffern angezeigt werden (z.B. "05" statt "5")
      const minutenText = String(minuten).padStart(2, "0");
      const sekundenText = String(sekunden).padStart(2, "0");
      return minutenText + ":" + sekundenText;
    }

    // Aktualisiert die große Anzeige mit dem aktuellen Wert von verbleibendeSekunden,
    // und zusammen damit auch den Fortschrittsring (siehe aktualisiereRing)
    function aktualisiereAnzeige() {
      anzeige.textContent = formatiereZeit(verbleibendeSekunden);
      aktualisiereRing();
    }

    // Berechnet, welcher Anteil der aktuellen Phase noch übrig ist, und setzt den
    // Fortschrittsring entsprechend. Der Ring leert sich: bei vollem Anteil (Phasenstart)
    // ist stroke-dashoffset 0 (ganzer Ring sichtbar), bei 0 Sekunden ist er beim vollen
    // Umfang (Ring komplett "leer"). Die eigentliche Animation übernimmt die
    // CSS-transition auf #ring-fortschritt.
    //
    // Wichtiger Sonderfall: bei "1 Sekunde übrig" behandeln wir den Ring schon als leer
    // (Anteil 0), nicht erst bei "0 Sekunden übrig". Grund: die CSS-Animation zum
    // Leerwerden braucht selbst eine volle Sekunde, um durchzulaufen. Würden wir sie erst
    // bei 0 Sekunden starten, würde der Phasenwechsel (der genau dann sofort passiert und
    // den Ring wieder auf "voll" zurücksetzt) die Animation sofort unterbrechen, bevor sie
    // überhaupt sichtbar durchgelaufen ist. So bekommt sie die letzte volle Sekunde der
    // Phase Zeit, um wirklich bei "leer" anzukommen, bevor der Wechsel erfolgt.
    function aktualisiereRing() {
      let anteilVerbleibend;
      if (aktuellePhaseDauer <= 1) {
        // Bei einer nur 1 Sekunde kurzen Phase bleibt keine Zeit für eine
        // "Vorlauf-Leerung" - hier reicht die normale Berechnung ohne Sonderfall
        anteilVerbleibend = aktuellePhaseDauer > 0 ? verbleibendeSekunden / aktuellePhaseDauer : 0;
      } else if (verbleibendeSekunden > 1) {
        anteilVerbleibend = verbleibendeSekunden / aktuellePhaseDauer;
      } else {
        anteilVerbleibend = 0; // letzte Sekunde der Phase: Ring gilt schon als leer
      }
      const versatz = RING_UMFANG * (1 - anteilVerbleibend);
      ringFortschritt.style.strokeDashoffset = versatz;
    }

    // Beendet eine gerade laufende Ring-Animation sofort, statt sie (bis zu 1 Sekunde
    // lang) zu Ende gleiten zu lassen. Wird bei Pause und Zurücksetzen gebraucht, damit
    // der Ring exakt im selben Moment stehen bleibt wie die Zahl, statt sichtbar
    // nachzuziehen. Trick: die CSS-transition kurz deaktivieren (dadurch springt der
    // Ring sofort zu seinem aktuellen Zielwert), einen Reflow erzwingen (der
    // Lesezugriff auf getBoundingClientRect sorgt dafür, dass "none" auch wirklich
    // angewendet wird) und die Transition danach wieder aktivieren, damit künftige
    // Änderungen erneut weich animieren.
    function stoppeRingAnimationSofort() {
      ringFortschritt.style.transition = "none";
      void ringFortschritt.getBoundingClientRect();
      ringFortschritt.style.transition = "";
    }

    // Phase 2: Aktualisiert Phasentext, Rundentext und die Hintergrundfarbe passend zur aktuellen Phase.
    // Phase 7a: liest Phase und Runde jetzt aus dem aktuellen Abschnitt des Ablaufplans
    // statt aus eigenen Variablen.
    // Phase 7b: Setzt genau eine der drei Phasenklassen am <body> - sie steuert
    // Hintergrund- und Ringfarbe (siehe CSS).
    function setzePhasenFarbe(klasse) {
      document.body.classList.remove("phase-uebung", "phase-pause", "phase-seitenwechsel");
      document.body.classList.add(klasse);
    }

    function aktualisierePhaseAnzeige() {
      const abschnitt = aktuellerAbschnitt();

      if (abschnitt.typ === "uebung") {
        // Bei zweiseitigen Übungen zusätzlich anzeigen, welche Seite gerade dran ist
        const seitenZusatz = abschnitt.seite ? " – " + abschnitt.seite.toUpperCase() : "";
        phaseAnzeige.textContent = beschriftungFuer(abschnitt).toUpperCase() + seitenZusatz;
        setzePhasenFarbe("phase-uebung");
      } else if (abschnitt.typ === "seitenwechsel") {
        phaseAnzeige.textContent = "SEITE WECHSELN";
        setzePhasenFarbe("phase-seitenwechsel");
      } else {
        phaseAnzeige.textContent = "PAUSE";
        setzePhasenFarbe("phase-pause");
      }

      rundenAnzeige.textContent = "Übung " + abschnitt.nummer + " von " + gesamtUebungen;
    }

    // Sperrt bzw. entsperrt alles, was während eines laufenden Trainings nicht
    // verändert werden darf. Phase 7b: Übungsliste und Presets werden dabei zusätzlich
    // komplett ausgeblendet (siehe body.training-laeuft im CSS), damit während der
    // Übung nur Ring und Steuerbuttons sichtbar sind.
    function eingabenAktivieren(aktiv) {
      document.body.classList.toggle("training-laeuft", !aktiv);

      pauseDauerEingabe.disabled = !aktiv;
      seitenwechselDauerEingabe.disabled = !aktiv;
      uebungHinzufuegenButton.disabled = !aktiv;

      // Phase 4: Preset-Speichern ebenfalls sperren, solange der Timer läuft
      presetNameEingabe.disabled = !aktiv;
      presetSpeichernButton.disabled = !aktiv;
      zeigeUebungenAn(); // Felder der Übungszeilen passend sperren/entsperren
      zeigePresetsAn(); // baut die Liste neu auf, damit "Laden"/"Löschen" passend gesperrt sind
    }

    // ---- Phase 7b: Die Übungsliste bedienen ----

    // Die Symbole der vier kleinen Buttons je Übungszeile. Als Inline-SVG (statt Emoji),
    // damit sie auf allen Geräten gleich aussehen - wie schon bei den Steuerbuttons.
    const SYMBOL_HOCH =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>';
    const SYMBOL_RUNTER =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
    const SYMBOL_DUPLIZIEREN =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
    const SYMBOL_LOESCHEN =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';

    // Erzeugt einen der kleinen Symbol-Buttons einer Übungszeile.
    // titel = Text, den Browser als Tooltip bzw. Screenreader vorlesen (reine
    // Symbol-Buttons brauchen sonst eine Beschriftung, die niemand sieht)
    function baueAktionsButton(symbol, titel, gesperrt, beiKlick) {
      const knopf = document.createElement("button");
      knopf.innerHTML = symbol;
      knopf.title = titel;
      knopf.setAttribute("aria-label", titel);
      knopf.disabled = gesperrt;
      knopf.addEventListener("click", beiKlick);
      return knopf;
    }

    // Baut die sichtbare Übungsliste komplett neu auf, ausgehend vom Inhalt von uebungen[].
    // Wird nur bei strukturellen Änderungen aufgerufen (hinzufügen, löschen, verschieben,
    // Preset laden) - beim Tippen in ein Feld ausdrücklich NICHT, weil das Eingabefeld
    // sonst mitten im Wort neu erzeugt würde und den Tastaturfokus verlöre.
    function zeigeUebungenAn() {
      const gesperrt = intervallId !== null;
      uebungenListe.innerHTML = "";

      uebungen.forEach(function (uebung, index) {
        const zeile = document.createElement("li");

        // --- obere Zeile: Nummer, Name, Dauer ---
        const kopf = document.createElement("div");
        kopf.className = "uebung-kopf";

        const nummer = document.createElement("span");
        nummer.className = "uebung-nummer";
        nummer.textContent = index + 1 + ".";

        const nameFeld = document.createElement("input");
        nameFeld.type = "text";
        nameFeld.className = "uebung-name";
        nameFeld.value = uebung.name;
        nameFeld.placeholder = "Übung " + (index + 1);
        nameFeld.disabled = gesperrt;
        nameFeld.addEventListener("input", function () {
          uebungen[index].name = nameFeld.value;
          routineGeaendert(false); // ohne Neuaufbau, sonst springt der Cursor aus dem Feld
        });

        const dauerFeld = document.createElement("input");
        dauerFeld.type = "number";
        dauerFeld.className = "uebung-dauer";
        dauerFeld.min = "1";
        dauerFeld.value = uebung.dauer;
        dauerFeld.disabled = gesperrt;
        dauerFeld.addEventListener("input", function () {
          uebungen[index].dauer = holeZahlAusEingabe(dauerFeld, 1);
          routineGeaendert(false);
        });

        const einheit = document.createElement("span");
        einheit.className = "uebung-einheit";
        einheit.textContent = "Sek.";

        kopf.appendChild(nummer);
        kopf.appendChild(nameFeld);
        kopf.appendChild(dauerFeld);
        kopf.appendChild(einheit);

        // --- untere Zeile: Häkchen "beide Seiten" und die vier Aktionen ---
        const fuss = document.createElement("div");
        fuss.className = "uebung-fuss";

        const seitenLabel = document.createElement("label");
        seitenLabel.className = "beide-seiten";

        const seitenHaken = document.createElement("input");
        seitenHaken.type = "checkbox";
        seitenHaken.checked = uebung.beideSeiten;
        seitenHaken.disabled = gesperrt;
        seitenHaken.addEventListener("change", function () {
          uebungen[index].beideSeiten = seitenHaken.checked;
          routineGeaendert(false);
        });

        seitenLabel.appendChild(seitenHaken);
        seitenLabel.appendChild(document.createTextNode("beide Seiten"));

        const aktionen = document.createElement("div");
        aktionen.className = "uebung-aktionen";

        aktionen.appendChild(baueAktionsButton(SYMBOL_HOCH, "Nach oben", gesperrt || index === 0, function () {
          verschiebeUebung(index, -1);
        }));
        aktionen.appendChild(baueAktionsButton(SYMBOL_RUNTER, "Nach unten", gesperrt || index === uebungen.length - 1, function () {
          verschiebeUebung(index, 1);
        }));
        aktionen.appendChild(baueAktionsButton(SYMBOL_DUPLIZIEREN, "Duplizieren", gesperrt, function () {
          dupliziereUebung(index);
        }));
        aktionen.appendChild(baueAktionsButton(SYMBOL_LOESCHEN, "Löschen", gesperrt, function () {
          loescheUebung(index);
        }));

        fuss.appendChild(seitenLabel);
        fuss.appendChild(aktionen);

        zeile.appendChild(kopf);
        zeile.appendChild(fuss);
        uebungenListe.appendChild(zeile);
      });
    }

    // Zeigt an, wie lange das komplette Training mit den aktuellen Einstellungen dauert.
    // Ohne diese Angabe wäre bei einer frei zusammengestellten Liste nicht mehr
    // absehbar, worauf man sich einlässt.
    function aktualisiereGesamtdauerAnzeige() {
      if (uebungen.length === 0) {
        gesamtdauerAnzeige.textContent = "";
      } else {
        gesamtdauerAnzeige.textContent = "Gesamt " + formatiereZeit(berechneGesamtdauer(ablaufplan));
      }
    }

    // Wird nach jeder Änderung an der Routine aufgerufen.
    // neuAufbauen = true, wenn sich die Struktur geändert hat (Anzahl oder Reihenfolge
    // der Übungen) und die sichtbare Liste deshalb neu gezeichnet werden muss.
    function routineGeaendert(neuAufbauen) {
      if (neuAufbauen) {
        zeigeUebungenAn();
      }
      speichereAktuelleRoutine();
      uebernehmeEinstellungen();
    }

    function fuegeUebungHinzu() {
      // Neue Übungen übernehmen die Dauer der letzten vorhandenen - in einer Routine
      // sind die Übungen meist gleich lang, das spart Tipparbeit.
      const letzteDauer = uebungen.length > 0 ? uebungen[uebungen.length - 1].dauer : 30;
      uebungen.push({ name: "", dauer: letzteDauer, beideSeiten: false });
      routineGeaendert(true);
    }

    function dupliziereUebung(index) {
      const vorlage = uebungen[index];
      // Eine echte Kopie einfügen, kein Verweis auf dasselbe Objekt - sonst würde eine
      // Änderung an der Kopie auch das Original mit verändern.
      uebungen.splice(index + 1, 0, { name: vorlage.name, dauer: vorlage.dauer, beideSeiten: vorlage.beideSeiten });
      routineGeaendert(true);
    }

    function loescheUebung(index) {
      uebungen.splice(index, 1);
      routineGeaendert(true);
    }

    // richtung = -1 für nach oben, +1 für nach unten
    function verschiebeUebung(index, richtung) {
      const ziel = index + richtung;
      if (ziel < 0 || ziel >= uebungen.length) {
        return; // am Rand der Liste passiert nichts
      }
      const zwischenspeicher = uebungen[index];
      uebungen[index] = uebungen[ziel];
      uebungen[ziel] = zwischenspeicher;
      routineGeaendert(true);
    }

    // Speichert die gerade eingestellte Routine, damit sie beim nächsten Öffnen der App
    // noch da ist (sonst müsste die Liste jedes Mal neu eingetippt werden).
    function speichereAktuelleRoutine() {
      // In try/catch, weil das Schreiben in den Browserspeicher fehlschlagen kann
      // (z.B. voller Speicher oder Browser mit gesperrtem Seitenspeicher). Der Timer
      // selbst soll dann trotzdem normal weiterlaufen - nur eben ohne zu merken,
      // wie die Routine zuletzt aussah.
      try {
        localStorage.setItem(
          AKTUELLE_ROUTINE_SCHLUESSEL,
          JSON.stringify({
            uebungen: uebungen,
            pauseDauer: holeZahlAusEingabe(pauseDauerEingabe, 1),
            seitenwechselDauer: holeZahlAusEingabe(seitenwechselDauerEingabe, 0)
          })
        );
      } catch (fehler) {
        // bewusst ignoriert - siehe Kommentar oben
      }
    }

    // Holt die zuletzt eingestellte Routine zurück. Ist nichts gespeichert (oder sind die
    // Daten unbrauchbar), wird mit einer einzelnen 30-Sekunden-Übung begonnen.
    function ladeAktuelleRoutine() {
      const gespeicherterText = localStorage.getItem(AKTUELLE_ROUTINE_SCHLUESSEL);
      let gelesen = null;

      if (gespeicherterText !== null) {
        try {
          gelesen = JSON.parse(gespeicherterText);
        } catch (fehler) {
          gelesen = null; // beschädigte Daten ignorieren statt die App blockieren
        }
      }

      if (gelesen && Array.isArray(gelesen.uebungen) && gelesen.uebungen.length > 0) {
        uebungen = gelesen.uebungen.map(saubereUebung);
        pauseDauerEingabe.value = gelesen.pauseDauer;
        seitenwechselDauerEingabe.value = gelesen.seitenwechselDauer;
      } else {
        uebungen = [{ name: "", dauer: 30, beideSeiten: false }];
      }
    }

    // Bringt einen gespeicherten Eintrag in die erwartete Form. Schützt davor, dass
    // unvollständige oder manipulierte Daten aus dem Speicher später zu Abstürzen führen.
    function saubereUebung(eintrag) {
      const dauer = parseInt(eintrag && eintrag.dauer, 10);
      return {
        name: eintrag && typeof eintrag.name === "string" ? eintrag.name : "",
        dauer: isNaN(dauer) || dauer < 1 ? 30 : dauer,
        beideSeiten: !!(eintrag && eintrag.beideSeiten)
      };
    }

    // ---- Phase 4: Presets speichern, laden und löschen (über localStorage) ----

    // Liest die gespeicherten Presets beim Start der Seite aus dem localStorage.
    // localStorage speichert nur Text, deshalb müssen wir mit JSON.parse wieder
    // ein normales JavaScript-Array daraus machen.
    function ladePresetsAusSpeicher() {
      // Phase 7b: Presets aus der Zeit vor der Übungsliste sind mit dem neuen Aufbau
      // nicht mehr verwendbar und sollten laut Absprache auch nicht übernommen werden -
      // deshalb wird der alte Speicherplatz einmalig geräumt.
      localStorage.removeItem(ALTER_PRESETS_SCHLUESSEL);

      const gespeicherterText = localStorage.getItem(PRESETS_SPEICHER_SCHLUESSEL);
      if (gespeicherterText === null) {
        presets = []; // noch nichts gespeichert
        return;
      }

      try {
        presets = JSON.parse(gespeicherterText);
      } catch (fehler) {
        presets = []; // beschädigte Daten ignorieren statt die App blockieren
      }
    }

    // Schreibt die aktuelle Preset-Liste in den localStorage (als JSON-Text),
    // damit sie auch nach dem Schließen des Browsers erhalten bleibt.
    function speicherePresetsInSpeicher() {
      localStorage.setItem(PRESETS_SPEICHER_SCHLUESSEL, JSON.stringify(presets));
    }

    // Baut die sichtbare Preset-Liste (die <ul>) komplett neu auf, ausgehend vom
    // aktuellen Inhalt von presets[]. Wird nach jeder Änderung erneut aufgerufen.
    function zeigePresetsAn() {
      presetsListe.innerHTML = ""; // Liste leeren, bevor sie neu aufgebaut wird

      presets.forEach(function (preset, index) {
        const listenEintrag = document.createElement("li");

        // Kurzinfo zum Inhalt: Anzahl der Übungen und wie lange die Routine läuft.
        // Die Gesamtdauer wird dafür aus den gespeicherten Daten durchgerechnet, ohne
        // das Preset laden zu müssen.
        const anzahl = preset.uebungen.length;
        const dauer = berechneGesamtdauer(baueAblaufplan(preset.uebungen, preset.pauseDauer, preset.seitenwechselDauer));

        const nameText = document.createElement("span");
        nameText.textContent =
          preset.name + " (" + anzahl + (anzahl === 1 ? " Übung · " : " Übungen · ") + formatiereZeit(dauer) + ")";

        const ladenButton = document.createElement("button");
        ladenButton.textContent = "Laden";
        ladenButton.disabled = intervallId !== null; // während der Timer läuft nicht ladbar
        ladenButton.addEventListener("click", function () {
          ladePreset(index);
        });

        const loeschenButton = document.createElement("button");
        loeschenButton.textContent = "Löschen";
        loeschenButton.disabled = intervallId !== null;
        loeschenButton.addEventListener("click", function () {
          loeschePreset(index);
        });

        listenEintrag.appendChild(nameText);
        listenEintrag.appendChild(ladenButton);
        listenEintrag.appendChild(loeschenButton);
        presetsListe.appendChild(listenEintrag);
      });
    }

    // Speichert die komplette aktuelle Routine (Übungsliste plus die beiden globalen
    // Werte) als neues Preset
    function speicherePreset() {
      const name = presetNameEingabe.value.trim();
      if (name === "" || uebungen.length === 0) {
        return; // ohne Namen oder ohne Übungen kein Preset anlegen
      }

      presets.push({
        name: name,
        // Echte Kopien der Übungen ablegen, damit spätere Änderungen an der aktuellen
        // Liste das gespeicherte Preset nicht nachträglich mit verändern
        uebungen: uebungen.map(saubereUebung),
        pauseDauer: holeZahlAusEingabe(pauseDauerEingabe, 1),
        seitenwechselDauer: holeZahlAusEingabe(seitenwechselDauerEingabe, 0)
      });

      speicherePresetsInSpeicher();
      zeigePresetsAn();
      presetNameEingabe.value = ""; // Eingabefeld für den nächsten Namen leeren
    }

    // Übernimmt ein gespeichertes Preset als aktuelle Routine
    function ladePreset(index) {
      const preset = presets[index];
      uebungen = preset.uebungen.map(saubereUebung); // Kopien, nicht das Original verändern
      pauseDauerEingabe.value = preset.pauseDauer;
      seitenwechselDauerEingabe.value = preset.seitenwechselDauer;
      zeigeUebungenAn();
      speichereAktuelleRoutine();
      setzeZurueck();
    }

    // Entfernt ein Preset aus der Liste und aktualisiert den localStorage
    function loeschePreset(index) {
      presets.splice(index, 1);
      speicherePresetsInSpeicher();
      zeigePresetsAn();
    }

    // ---- Phase 3: akustische und haptische Signale ----

    // Erzeugt den Audio-Kontext einmalig und "entsperrt" die drei Sound-Dateien.
    // Muss innerhalb eines Klicks aufgerufen werden (z.B. beim Start-Button), sonst
    // blockieren Browser jegliche Tonausgabe ohne vorherige Nutzer-Interaktion.
    function initialisiereAudio() {
      if (audioContext === null) {
        // "webkitAudioContext" ist ein Fallback für ältere Safari-Versionen
        const AudioContextKlasse = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextKlasse();

        // Jede Sound-Datei einmal kurz an- und wieder ausschalten. Das "entsperrt" die
        // Wiedergabe für spätere, nicht durch einen Klick ausgelöste play()-Aufrufe
        // (z.B. aus dem laufenden Countdown heraus).
        [beepSound, endSound, startSound, seitenwechselSound1, seitenwechselSound2].forEach(function (audioElement) {
          audioElement
            .play()
            .then(function () {
              audioElement.pause();
              audioElement.currentTime = 0;
            })
            .catch(function () {
              // Entsperren fehlgeschlagen (z.B. Browser-Einschränkung) - beim eigentlichen
              // Abspielen später wird es einfach erneut versucht
            });
        });
      }
    }

    // Erzeugt einen kurzen Signalton über die Web Audio API (kein Audio-File nötig).
    // frequenz = Tonhöhe in Hertz, dauerSekunden = wie lange der Ton klingt.
    function spieleTon(frequenz, dauerSekunden) {
      if (audioContext === null || stummgeschaltet) {
        return; // Audio noch nicht initialisiert oder Lautlos-Modus aktiv
      }

      const oszillator = audioContext.createOscillator(); // erzeugt die eigentliche Tonwelle
      const lautstaerkeRegler = audioContext.createGain(); // steuert die Lautstärke über die Zeit

      oszillator.frequency.value = frequenz;
      oszillator.connect(lautstaerkeRegler);
      lautstaerkeRegler.connect(audioContext.destination);

      // Lautstärke sanft ausklingen lassen, damit der Ton nicht abrupt "klickt"
      lautstaerkeRegler.gain.setValueAtTime(0.3, audioContext.currentTime);
      lautstaerkeRegler.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + dauerSekunden);

      oszillator.start();
      oszillator.stop(audioContext.currentTime + dauerSekunden);
    }

    // Löst eine kurze Vibration aus, falls der Browser das unterstützt (z.B. Android/Chrome).
    // Auf Geräten/Browsern ohne Unterstützung (z.B. iOS Safari) passiert einfach nichts.
    function vibriere(muster) {
      if (navigator.vibrate) {
        navigator.vibrate(muster);
      }
    }

    // Spielt eine der drei geladenen Sound-Dateien ab. currentTime wird vorher auf 0
    // gesetzt, damit der Sound auch dann sauber von vorne startet, wenn er kurz zuvor
    // schon einmal abgespielt wurde.
    function spieleAudioDatei(audioElement) {
      if (stummgeschaltet) {
        return; // Lautlos-Modus aktiv - kein Ton abspielen
      }
      audioElement.currentTime = 0;
      audioElement.play().catch(function () {
        // Wiedergabe blockiert oder Datei nicht ladbar - Training läuft trotzdem normal weiter
      });
    }

    // Phase 7c: Signal für den Seitenwechsel - zwei kurze Anschläge kurz hintereinander
    // und ein doppelter Vibrationsstoß. Beides unterscheidet sich bewusst vom einzelnen
    // Ton und dem einzelnen Vibrationsstoß der übrigen Wechsel.
    function spieleSeitenwechselSignal() {
      spieleAudioDatei(seitenwechselSound1);
      setTimeout(function () {
        spieleAudioDatei(seitenwechselSound2);
      }, 200);
      vibriere([120, 80, 120]);
    }

    // Signal bei einem Phasenwechsel. Der Klang richtet sich danach, was als Nächstes
    // kommt - denn das ist die Information, die während der Übung gebraucht wird:
    // umlagern, ausruhen oder weitermachen?
    function spielePhasenwechselSignal(beendeterTyp, neuerTyp) {
      // Ein Seitenwechsel liegt auch dann vor, wenn zwei Übungsabschnitte direkt
      // aufeinander folgen - das passiert bei einer Seitenwechseldauer von 0 Sekunden.
      const seitenwechselStehtAn = neuerTyp === "seitenwechsel" || (beendeterTyp === "uebung" && neuerTyp === "uebung");

      if (seitenwechselStehtAn) {
        spieleSeitenwechselSignal();
        return;
      }

      if (neuerTyp === "pause") {
        spieleAudioDatei(endSound); // Pause beginnt -> "end.wav"
      } else {
        spieleAudioDatei(startSound); // Übung beginnt -> "start.wav"
      }
      vibriere(200); // einzelne kurze Vibration (200ms), wie bisher bei jedem Phasenwechsel
    }

    // Signal, wenn das gesamte Training (alle Runden) abgeschlossen ist.
    // Bleibt bewusst der synthetische Web-Audio-Ton (kein Sound-File), damit er sich
    // klar von den Phasenwechsel-Sounds unterscheidet. Unverändert eigenständig,
    // keine Vorwarnung davor (siehe timerSchritt).
    function spieleEndSignal() {
      spieleTon(440, 0.6); // längerer, tieferer Ton
      vibriere([200, 100, 200, 100, 200]); // mehrfaches Vibrationsmuster
    }

    // Warnton für die Countdown-Vorwarnung ("pop.wav"), zweimal identisch abgespielt.
    function spieleWarnton() {
      spieleAudioDatei(beepSound);
    }

    // Bei diesen Werten von verbleibendeSekunden ertönt vor dem eigentlichen
    // Phasenwechsel jeweils der Warnton (siehe timerSchritt). Drei Warntöne mit exakt
    // 1 Sekunde Abstand, gefolgt vom unterscheidbaren Finalton bei 0.
    const VORWARN_SEKUNDEN = [3, 2, 1];

    // Prüft, ob nach Ablauf der aktuellen Phase ein normaler Phasenwechsel folgt
    // (im Gegensatz zum endgültigen Trainingsende, das kein Vorwarn-Countdown bekommt,
    // weil sein Signal separat und unverändert bleiben soll).
    // Phase 7a: Das ist jetzt eine reine Positionsfrage - gibt es im Ablaufplan noch
    // einen Eintrag hinter dem aktuellen?
    function stehtNormalerPhasenwechselBevor() {
      return aktuellerAbschnittIndex < ablaufplan.length - 1;
    }

    // Wird jede Sekunde aufgerufen, solange der Timer läuft
    function timerSchritt() {
      verbleibendeSekunden--;
      aktualisiereAnzeige();

      // Countdown-Vorwarnung (zwei identische kurze Töne kurz vor dem Phasenwechsel).
      // Der dritte, unterscheidbare Ton kommt weiter unten in wechsleZurNaechstenPhase,
      // sobald verbleibendeSekunden 0 erreicht - das ist der tatsächliche Phasenwechsel.
      if (stehtNormalerPhasenwechselBevor() && VORWARN_SEKUNDEN.includes(verbleibendeSekunden)) {
        spieleWarnton();
      }

      if (verbleibendeSekunden <= 0) {
        wechsleZurNaechstenPhase();
      }
    }

    // Phase 2 / Phase 7a: Kernstück der Mehrphasen-Logik.
    // Wird aufgerufen, sobald ein Abschnitt (Übung oder Pause) abgelaufen ist.
    // Vorher stand hier die ganze Entscheidungslogik ("war das die letzte Runde?",
    // "kommt jetzt Pause oder Übung?"). Diese Fragen sind beim Aufbau des Ablaufplans
    // bereits beantwortet - hier wird nur noch einen Schritt weitergerückt.
    function wechsleZurNaechstenPhase() {
      const beendeterAbschnitt = aktuellerAbschnitt(); // merken, welcher Abschnitt hier endet

      // Kein weiterer Eintrag im Plan? Dann ist das Training vorbei.
      if (!stehtNormalerPhasenwechselBevor()) {
        beendeTraining();
        return;
      }

      aktuellerAbschnittIndex++;
      uebernehmeAktuellenAbschnitt();

      aktualisiereAnzeige();
      aktualisierePhaseAnzeige();
      // Sound + Vibration, abhängig davon, was endet und was als Nächstes kommt
      spielePhasenwechselSignal(beendeterAbschnitt.typ, aktuellerAbschnitt().typ);
    }

    // Phase 2: Wird aufgerufen, wenn alle Runden abgeschlossen sind
    function beendeTraining() {
      clearInterval(intervallId);
      intervallId = null;
      spieleEndSignal(); // Phase 3: eigenes Signal für das Trainingsende
      fertigMeldung.textContent = "Training abgeschlossen!";
      startButton.disabled = false;
      pauseButton.disabled = true;
      eingabenAktivieren(true);
    }

    // Startet den Countdown
    function starteTimer() {
      // Falls schon ein Timer läuft, nichts tun (verhindert doppelte Intervalle)
      if (intervallId !== null) {
        return;
      }

      // Phase 7b: Ohne Übungen gibt es nichts zu starten
      if (ablaufplan.length === 0) {
        return;
      }

      fertigMeldung.textContent = "";
      initialisiereAudio(); // Phase 3: Audio hier starten, da wir gerade in einem Klick-Handler sind

      // setInterval ruft timerSchritt() alle 1000 Millisekunden (= 1 Sekunde) auf
      intervallId = setInterval(timerSchritt, 1000);

      startButton.disabled = true;
      pauseButton.disabled = false;
      eingabenAktivieren(false); // während der Timer läuft, keine Änderung der Einstellungen erlauben
    }

    // Pausiert den Countdown, ohne die verbleibende Zeit oder Runde zu verlieren
    function pausiereTimer() {
      clearInterval(intervallId);
      intervallId = null;
      stoppeRingAnimationSofort(); // Ring friert sofort an der aktuellen Stelle ein

      startButton.disabled = false;
      pauseButton.disabled = true;
    }

    // Phase 7a/7b: Baut den Ablaufplan aus den aktuellen Einstellungen neu auf und
    // stellt die Anzeige auf dessen Anfang. Bewusst getrennt von setzeZurueck(): Diese
    // Funktion rührt die Bedienoberfläche nicht an und kann deshalb auch bei jedem
    // Tastendruck in einem Eingabefeld aufgerufen werden, ohne den Tastaturfokus zu
    // stören.
    function uebernehmeEinstellungen() {
      ablaufplan = erzeugeAblaufplan();
      aktuellerAbschnittIndex = 0;
      aktualisiereGesamtdauerAnzeige();

      if (ablaufplan.length === 0) {
        // Ohne Übungen gibt es nichts anzuzeigen und nichts zu starten
        verbleibendeSekunden = 0;
        aktuellePhaseDauer = 0;
        phaseAnzeige.textContent = "KEINE ÜBUNG";
        rundenAnzeige.textContent = "Füge unten eine Übung hinzu";
        setzePhasenFarbe("phase-uebung");
        aktualisiereAnzeige();
        stoppeRingAnimationSofort();
        startButton.disabled = true;
        return;
      }

      uebernehmeAktuellenAbschnitt();
      aktualisiereAnzeige();
      aktualisierePhaseAnzeige();
      stoppeRingAnimationSofort(); // Ring springt sofort auf den neuen Stand, statt hinzugleiten
      startButton.disabled = false;
    }

    // Setzt den Timer auf den Anfang der Routine zurück (erste Übung, Sekunde 0)
    function setzeZurueck() {
      clearInterval(intervallId);
      intervallId = null;

      uebernehmeEinstellungen();

      fertigMeldung.textContent = "";
      pauseButton.disabled = true;
      eingabenAktivieren(true);
    }

    // Schaltet den Lautlos-Modus um und aktualisiert Symbol/Optik des Buttons
    // (reines Symbol statt Text: 🔈 = Ton an, 🔇 = durchgestrichen/stumm)
    // Die beiden SVG-Icons für den Ton-Button (Lautsprecher an / durchgestrichen).
    // Werden per innerHTML eingesetzt, da es zwei verschiedene Icons sind (kein
    // einzelnes Zeichen wie bei textContent).
    const SYMBOL_TON_AN =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>' +
      '<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>' +
      "</svg>";

    const SYMBOL_TON_AUS =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon>' +
      '<line x1="23" y1="9" x2="17" y2="15"></line>' +
      '<line x1="17" y1="9" x2="23" y2="15"></line>' +
      "</svg>";

    function schalteStummUm() {
      stummgeschaltet = !stummgeschaltet;
      stummButton.innerHTML = stummgeschaltet ? SYMBOL_TON_AUS : SYMBOL_TON_AN;
      stummButton.classList.toggle("stumm-aktiv", stummgeschaltet);
    }

    // ---- Buttons mit den Funktionen verknüpfen ----
    startButton.addEventListener("click", starteTimer);
    pauseButton.addEventListener("click", pausiereTimer);
    resetButton.addEventListener("click", setzeZurueck);
    stummButton.addEventListener("click", schalteStummUm);

    // Phase 7b: Übung hinzufügen
    uebungHinzufuegenButton.addEventListener("click", fuegeUebungHinzu);

    // Wenn der Nutzer eine der beiden globalen Einstellungen ändert (bevor der Timer
    // läuft), Anzeige direkt aktualisieren. routineGeaendert(false) baut die Übungsliste
    // dabei nicht neu auf, damit der Cursor im Eingabefeld bleibt.
    pauseDauerEingabe.addEventListener("input", function () {
      if (intervallId === null) {
        routineGeaendert(false);
      }
    });
    seitenwechselDauerEingabe.addEventListener("input", function () {
      if (intervallId === null) {
        routineGeaendert(false);
      }
    });

    // Phase 4: Preset-Speichern-Button mit der Speicherfunktion verknüpfen
    presetSpeichernButton.addEventListener("click", speicherePreset);

    // Phase 4: gespeicherte Presets aus dem localStorage laden und anzeigen
    ladePresetsAusSpeicher();

    // Phase 7b: zuletzt eingestellte Routine wiederherstellen und anzeigen
    ladeAktuelleRoutine();
    zeigeUebungenAn();

    // Beim Laden der Seite die Anzeige einmal initialisieren
    setzeZurueck();

    // PWA: Service Worker registrieren, damit die App offline funktioniert und auf
    // Android ueber Chrome installierbar wird. Der Check "in navigator" sorgt dafuer,
    // dass nichts passiert, falls ein Browser Service Worker gar nicht unterstuetzt.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (fehler) {
          console.log("Service Worker konnte nicht registriert werden:", fehler);
        });
      });
    }
  </script>

</body>
