<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Intervalltimer</title>
<style>
  /* Grundlegendes Layout: alles zentriert auf der Seite */
  body {
    font-family: Arial, sans-serif;
    background-color: #1e1e2f;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    /* Sanfter Übergang, wenn sich die Hintergrundfarbe je nach Phase ändert */
    transition: background-color 0.4s ease;
  }

  /* Phase 2: Hintergrundfarbe zeigt, ob gerade "Übung" oder "Pause" aktiv ist */
  body.phase-uebung {
    background-color: #7a1f1f; /* warmes Rot = Anstrengung */
  }

  body.phase-pause {
    background-color: #1f4d3a; /* beruhigendes Grün = Erholung */
  }

  h1 {
    margin-bottom: 20px;
  }

  /* Eingabebereich: die drei Einstellungsfelder nebeneinander */
  #eingabe-bereich {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }

  .eingabe-feld {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  input[type="number"] {
    width: 80px;
    padding: 8px;
    font-size: 18px;
    text-align: center;
    border-radius: 6px;
    border: none;
  }

  /* Zeigt die aktuelle Phase als Text (z.B. "ÜBUNG" oder "PAUSE") */
  #phase-anzeige {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }

  /* Zeigt den Rundenfortschritt, z.B. "Runde 3 von 5" */
  #runden-anzeige {
    font-size: 20px;
    margin-bottom: 10px;
    opacity: 0.85;
  }

  /* Die große Countdown-Anzeige */
  #anzeige {
    font-size: 100px;
    font-weight: bold;
    margin: 20px 0;
    font-variant-numeric: tabular-nums; /* Ziffern bleiben gleich breit, kein "Wackeln" */
  }

  /* Buttons */
  button {
    font-size: 18px;
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background-color: #4a4a6a;
    color: white;
  }

  button:hover {
    background-color: #6a6a9a;
  }

  button:disabled {
    background-color: #333344;
    cursor: not-allowed;
  }

  /* Wird angezeigt, wenn das Training abgelaufen ist */
  #fertig-meldung {
    font-size: 24px;
    color: #7CFC00;
    height: 30px;
  }
</style>
</head>
<body>

  <h1>Intervalltimer</h1>

  <div id="eingabe-bereich">
    <div class="eingabe-feld">
      <label for="uebung-dauer-eingabe">Übung (Sek.)</label>
      <input type="number" id="uebung-dauer-eingabe" value="30" min="1">
    </div>
    <div class="eingabe-feld">
      <label for="pause-dauer-eingabe">Pause (Sek.)</label>
      <input type="number" id="pause-dauer-eingabe" value="15" min="1">
    </div>
    <div class="eingabe-feld">
      <label for="runden-eingabe">Runden</label>
      <input type="number" id="runden-eingabe" value="5" min="1">
    </div>
  </div>

  <!-- Zeigt an, ob gerade "Übung" oder "Pause" läuft -->
  <div id="phase-anzeige">ÜBUNG</div>

  <!-- Zeigt den Rundenfortschritt an -->
  <div id="runden-anzeige">Runde 1 von 5</div>

  <!-- Hier wird der Countdown groß angezeigt -->
  <div id="anzeige">00:30</div>

  <div id="fertig-meldung"></div>

  <div id="button-bereich">
    <button id="start-button">Start</button>
    <button id="pause-button" disabled>Pause</button>
    <button id="reset-button">Zurücksetzen</button>
  </div>

  <script>
    // ---- Variablen, die den Zustand des Timers speichern ----

    // verbleibende Sekunden der aktuell laufenden Phase (Übung oder Pause)
    let verbleibendeSekunden = 30;

    // die ID des laufenden Intervalls (wird von setInterval zurückgegeben).
    // Wir brauchen sie, um den Timer später wieder stoppen zu können (clearInterval).
    let intervallId = null;

    // Phase 2: welche Phase ist gerade aktiv? "uebung" oder "pause"
    let aktuellePhase = "uebung";

    // Phase 2: in welcher Runde befinden wir uns gerade (beginnt bei 1)
    let aktuelleRunde = 1;

    // Phase 2: wie viele Runden sollen insgesamt trainiert werden (wird aus der Eingabe gelesen)
    let gesamtRunden = 5;

    // Phase 3: der Audio-Kontext für erzeugte Signaltöne (Web Audio API).
    // Bleibt anfangs "null" und wird erst beim ersten Start erzeugt (siehe initialisiereAudio),
    // weil Browser Töne nur nach einer Nutzer-Interaktion erlauben (Klick auf "Start").
    let audioContext = null;

    // ---- Referenzen auf die HTML-Elemente holen ----
    const uebungDauerEingabe = document.getElementById("uebung-dauer-eingabe");
    const pauseDauerEingabe = document.getElementById("pause-dauer-eingabe");
    const rundenEingabe = document.getElementById("runden-eingabe");
    const phaseAnzeige = document.getElementById("phase-anzeige");
    const rundenAnzeige = document.getElementById("runden-anzeige");
    const anzeige = document.getElementById("anzeige");
    const fertigMeldung = document.getElementById("fertig-meldung");
    const startButton = document.getElementById("start-button");
    const pauseButton = document.getElementById("pause-button");
    const resetButton = document.getElementById("reset-button");

    // Liest eine Zahl aus einem Eingabefeld und sorgt dafür, dass sie mindestens "minimum" ist
    function holeZahlAusEingabe(element, minimum) {
      let wert = parseInt(element.value, 10);
      if (isNaN(wert) || wert < minimum) {
        wert = minimum;
      }
      return wert;
    }

    // Wandelt eine Anzahl Sekunden in das Format "MM:SS" um, z.B. 75 -> "01:15"
    function formatiereZeit(sekundenGesamt) {
      const minuten = Math.floor(sekundenGesamt / 60);
      const sekunden = sekundenGesamt % 60;
      // padStart(2, "0") sorgt dafür, dass immer zwei Ziffern angezeigt werden (z.B. "05" statt "5")
      const minutenText = String(minuten).padStart(2, "0");
      const sekundenText = String(sekunden).padStart(2, "0");
      return minutenText + ":" + sekundenText;
    }

    // Aktualisiert die große Anzeige mit dem aktuellen Wert von verbleibendeSekunden
    function aktualisiereAnzeige() {
      anzeige.textContent = formatiereZeit(verbleibendeSekunden);
    }

    // Phase 2: Aktualisiert Phasentext, Rundentext und die Hintergrundfarbe passend zur aktuellen Phase
    function aktualisierePhaseAnzeige() {
      if (aktuellePhase === "uebung") {
        phaseAnzeige.textContent = "ÜBUNG";
        document.body.classList.remove("phase-pause");
        document.body.classList.add("phase-uebung");
      } else {
        phaseAnzeige.textContent = "PAUSE";
        document.body.classList.remove("phase-uebung");
        document.body.classList.add("phase-pause");
      }
      rundenAnzeige.textContent = "Runde " + aktuelleRunde + " von " + gesamtRunden;
    }

    // Aktiviert oder deaktiviert die drei Eingabefelder (z.B. gesperrt, solange der Timer läuft)
    function eingabenAktivieren(aktiv) {
      uebungDauerEingabe.disabled = !aktiv;
      pauseDauerEingabe.disabled = !aktiv;
      rundenEingabe.disabled = !aktiv;
    }

    // ---- Phase 3: akustische und haptische Signale ----

    // Erzeugt den Audio-Kontext einmalig. Muss innerhalb eines Klicks aufgerufen werden
    // (z.B. beim Start-Button), sonst blockieren Browser die Tonausgabe.
    function initialisiereAudio() {
      if (audioContext === null) {
        // "webkitAudioContext" ist ein Fallback für ältere Safari-Versionen
        const AudioContextKlasse = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextKlasse();
      }
    }

    // Erzeugt einen kurzen Signalton über die Web Audio API (kein Audio-File nötig).
    // frequenz = Tonhöhe in Hertz, dauerSekunden = wie lange der Ton klingt.
    function spieleTon(frequenz, dauerSekunden) {
      if (audioContext === null) {
        return; // Audio wurde noch nicht initialisiert (z.B. vor dem ersten Start)
      }

      const oszillator = audioContext.createOscillator(); // erzeugt die eigentliche Tonwelle
      const lautstaerkeRegler = audioContext.createGain(); // steuert die Lautstärke über die Zeit

      oszillator.frequency.value = frequenz;
      oszillator.connect(lautstaerkeRegler);
      lautstaerkeRegler.connect(audioContext.destination);

      // Lautstärke sanft ausklingen lassen, damit der Ton nicht abrupt "klickt"
      lautstaerkeRegler.gain.setValueAtTime(0.3, audioContext.currentTime);
      lautstaerkeRegler.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + dauerSekunden);

      oszillator.start();
      oszillator.stop(audioContext.currentTime + dauerSekunden);
    }

    // Löst eine kurze Vibration aus, falls der Browser das unterstützt (z.B. Android/Chrome).
    // Auf Geräten/Browsern ohne Unterstützung (z.B. iOS Safari) passiert einfach nichts.
    function vibriere(muster) {
      if (navigator.vibrate) {
        navigator.vibrate(muster);
      }
    }

    // Signal bei einem normalen Phasenwechsel (Übung -> Pause oder Pause -> Übung)
    function spielePhasenwechselSignal() {
      spieleTon(880, 0.15); // kurzer, hoher Ton
      vibriere(200); // einzelne kurze Vibration (200ms)
    }

    // Signal, wenn das gesamte Training (alle Runden) abgeschlossen ist.
    // Bewusst länger/tiefer als der normale Phasenwechsel-Ton, damit er sich klar unterscheidet.
    function spieleEndSignal() {
      spieleTon(440, 0.6); // längerer, tieferer Ton
      vibriere([200, 100, 200, 100, 200]); // mehrfaches Vibrationsmuster
    }

    // Wird jede Sekunde aufgerufen, solange der Timer läuft
    function timerSchritt() {
      verbleibendeSekunden--;
      aktualisiereAnzeige();

      if (verbleibendeSekunden <= 0) {
        wechsleZurNaechstenPhase();
      }
    }

    // Phase 2: Kernstück der Mehrphasen-Logik.
    // Wird aufgerufen, sobald eine Phase (Übung oder Pause) abgelaufen ist,
    // und entscheidet, wie es weitergeht.
    function wechsleZurNaechstenPhase() {
      if (aktuellePhase === "uebung") {
        // Die Übung ist vorbei. War das schon die letzte Runde? Dann ist keine
        // weitere Pause mehr nötig -> Training direkt beenden.
        if (aktuelleRunde >= gesamtRunden) {
          beendeTraining();
          return;
        }
        // Sonst folgt die Pause dieser Runde
        aktuellePhase = "pause";
        verbleibendeSekunden = holeZahlAusEingabe(pauseDauerEingabe, 1);
      } else {
        // Die Pause ist vorbei -> nächste Runde beginnt mit einer neuen Übungsphase
        aktuelleRunde++;
        aktuellePhase = "uebung";
        verbleibendeSekunden = holeZahlAusEingabe(uebungDauerEingabe, 1);
      }

      aktualisiereAnzeige();
      aktualisierePhaseAnzeige();
      spielePhasenwechselSignal(); // Phase 3: Ton + Vibration bei jedem Phasenwechsel
    }

    // Phase 2: Wird aufgerufen, wenn alle Runden abgeschlossen sind
    function beendeTraining() {
      clearInterval(intervallId);
      intervallId = null;
      spieleEndSignal(); // Phase 3: eigenes Signal für das Trainingsende
      fertigMeldung.textContent = "Training abgeschlossen!";
      startButton.disabled = false;
      pauseButton.disabled = true;
      eingabenAktivieren(true);
    }

    // Startet den Countdown
    function starteTimer() {
      // Falls schon ein Timer läuft, nichts tun (verhindert doppelte Intervalle)
      if (intervallId !== null) {
        return;
      }

      fertigMeldung.textContent = "";
      initialisiereAudio(); // Phase 3: Audio hier starten, da wir gerade in einem Klick-Handler sind

      // setInterval ruft timerSchritt() alle 1000 Millisekunden (= 1 Sekunde) auf
      intervallId = setInterval(timerSchritt, 1000);

      startButton.disabled = true;
      pauseButton.disabled = false;
      eingabenAktivieren(false); // während der Timer läuft, keine Änderung der Einstellungen erlauben
    }

    // Pausiert den Countdown, ohne die verbleibende Zeit oder Runde zu verlieren
    function pausiereTimer() {
      clearInterval(intervallId);
      intervallId = null;

      startButton.disabled = false;
      pauseButton.disabled = true;
    }

    // Setzt den Timer auf die eingegebenen Einstellungen zurück (Runde 1, Phase "Übung")
    function setzeZurueck() {
      clearInterval(intervallId);
      intervallId = null;

      // Einstellungen neu aus den Eingabefeldern lesen (mindestens 1)
      gesamtRunden = holeZahlAusEingabe(rundenEingabe, 1);
      aktuellePhase = "uebung";
      aktuelleRunde = 1;
      verbleibendeSekunden = holeZahlAusEingabe(uebungDauerEingabe, 1);

      aktualisiereAnzeige();
      aktualisierePhaseAnzeige();

      fertigMeldung.textContent = "";
      startButton.disabled = false;
      pauseButton.disabled = true;
      eingabenAktivieren(true);
    }

    // ---- Buttons mit den Funktionen verknüpfen ----
    startButton.addEventListener("click", starteTimer);
    pauseButton.addEventListener("click", pausiereTimer);
    resetButton.addEventListener("click", setzeZurueck);

    // Wenn der Nutzer eine Einstellung ändert (bevor der Timer läuft), Anzeige direkt aktualisieren
    uebungDauerEingabe.addEventListener("input", function () {
      if (intervallId === null) {
        setzeZurueck();
      }
    });
    pauseDauerEingabe.addEventListener("input", function () {
      if (intervallId === null) {
        setzeZurueck();
      }
    });
    rundenEingabe.addEventListener("input", function () {
      if (intervallId === null) {
        setzeZurueck();
      }
    });

    // Beim Laden der Seite die Anzeige einmal initialisieren
    setzeZurueck();
  </script>

</body>
</html>
